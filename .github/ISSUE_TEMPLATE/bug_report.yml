name: Bug Report
description: File a bug report to help improve E3SM AI Platform and E3SM Compass.
title: "[Bug]: "
labels: ["bug"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Use this form for defects, including UI/UX and accessibility problems. Use Enhancement Request for new capabilities or improvements. Maintainers can add `ui/ux` or `accessibility` labels during triage.

        Do not report security vulnerabilities or share exploit details in public issues. Use [GitHub private vulnerability reporting](https://github.com/E3SM-Project/e3sm-ai-platform/security/advisories/new).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe what you were trying to do and what went wrong.
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: List the smallest set of steps that reproduces the problem.
      placeholder: |
        1. ...
        2. ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: Describe what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the affected component (backend, frontend, evaluation, or tooling), commit or release version, and relevant runtime and configuration details. Remove secrets.
      placeholder: |
        Affected component:
        Commit or release version:
        OS:
        Relevant runtime versions (Python, uv, Node.js, browser):
        Relevant configuration (no secrets):
    validations:
      required: false

  - type: textarea
    id: logs-or-screenshots
    attributes:
      label: Relevant logs, code, or screenshots
      description: Remove secrets, credentials, and sensitive prompts before sharing.
    validations:
      required: false

  - type: textarea
    id: extra-context
    attributes:
      label: Additional context
      description: Add any other useful details, related issues, or links.
    validations:
      required: false
