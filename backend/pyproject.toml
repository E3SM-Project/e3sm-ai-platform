[project]
name = "e3sm-ai-platform-backend"
version = "0.1.0"
description = "Provider-independent backend for E3SM Compass."
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.116.0",
  "httpx>=0.28.0",
  "llama-index-core>=0.14,<0.15",
  "pydantic>=2.11.0",
  "openai>=1.99,<4",
  "opentelemetry-exporter-otlp-proto-http>=1.36,<2",
  "opentelemetry-instrumentation-fastapi>=0.57b0,<1",
  "opentelemetry-sdk>=1.36,<2",
  "python-dotenv>=1.1.0",
  "uvicorn>=0.35.0",
  "llama-index-embeddings-huggingface>=0.6,<0.7",
]

[dependency-groups]
dev = [
  "pytest>=8.4.0",
  "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/e3sm_ai_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
